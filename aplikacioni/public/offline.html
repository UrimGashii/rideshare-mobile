<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideShare · Lista e ruajtur</title>
<style>body{margin:0;background:#0b101b;color:#edf2ff;font:18px/1.6 system-ui,sans-serif}main{max-width:720px;margin:auto;padding:24px}h1{font-size:clamp(28px,7vw,42px)}button{font:inherit;padding:12px 18px;border:2px solid #fda4af;border-radius:12px;background:#4b1e32;color:inherit}button:disabled{opacity:.7}.trip-card{padding:18px;margin:18px 0;border:1px solid #546078;border-radius:14px}#source{padding:16px;border-left:4px solid #fda4af;background:#1c2438}a{color:#fda4af}</style></head><body><main>
<p>RideShare AAB · Lexim publik</p><h1>Udhëtimet, edhe pa internet</h1><p id="source" role="status">Po lexojmë listën…</p><p>Ruajtur për herë të fundit: <time id="saved">—</time></p><button id="refresh">Rifresko listën</button><div id="trips"></div><button disabled>Kërko vend · kërkon lidhje dhe server</button><p>Kjo pamje shërben vetëm për lexim; asnjë rezervim nuk është konfirmuar.</p><a href="/">Kthehu te aplikacioni</a>
</main><script>const source=document.querySelector("#source"),list=document.querySelector("#trips"),refresh=document.querySelector("#refresh");async function load(){refresh.disabled=true;try{const r=await fetch("/api/udhetimet",{cache:"no-store"}),d=await r.json();if(!r.ok||!Array.isArray(d.trips))throw 0;list.replaceChildren();for(const t of d.trips){const c=document.createElement("article");c.className="trip-card";const h=document.createElement("h2");h.textContent=t.nisja+" → "+t.destinacioni;const p=document.createElement("p");p.textContent="Ora: "+t.ora+" · Vende në këtë kopje: "+t.vende;c.append(h,p);list.append(c)}const s=r.headers.get("x-rideshare-saved-at");document.querySelector("#saved").textContent=s?new Date(s).toLocaleString("sq-AL"):"Lexuar drejtpërdrejt";source.textContent=r.headers.get("x-rideshare-source")==="cache"?"Lista e fundit e ruajtur · Mund të jetë vjetruar.":"Lista erdhi nga serveri."}catch{source.textContent="Ende nuk ka listë të ruajtur ose serveri nuk u arrit."}finally{refresh.disabled=false}}refresh.onclick=load;load();</script></body></html>
